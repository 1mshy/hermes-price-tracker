name: hermes-shopping

services:
  # ── price engine: scrapers, tracker, notifier, MCP server ───────────────
  pricewatch:
    build: ./pricewatch
    image: hermes-shopping/pricewatch:1.0.0
    env_file: [.env]
    environment:
      PW_DB_URL: ${PW_DB_URL:-sqlite:////data/pricewatch.db}
    ports:
      - "${PW_PORT:-8077}:8000"
    volumes:
      - ./data:/data
    shm_size: 1gb            # Chromium crashes on the default 64 MB
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── the agent you talk to ───────────────────────────────────────────────
  hermes:
    build: ./hermes
    image: hermes-shopping/hermes:1.0.0
    env_file: [.env]
    environment:
      PRICEWATCH_MCP_URL: http://pricewatch:8000/mcp
      PRICEWATCH_HEALTH_URL: http://pricewatch:8000/api/health
    depends_on:
      pricewatch:
        condition: service_healthy
    volumes:
      - hermes_home:/root/.hermes
      - ./workspace:/work
    stdin_open: true          # `docker compose run --rm hermes` gives an interactive agent
    tty: true
    restart: "no"

  # ── browser dashboard: chat with the agent, manage config/keys/sessions ──
  dashboard:
    build: ./hermes
    image: hermes-shopping/hermes:1.0.0
    env_file: [.env]
    environment:
      PRICEWATCH_MCP_URL: http://pricewatch:8000/mcp
      PRICEWATCH_HEALTH_URL: http://pricewatch:8000/api/health
    # Binding off loopback always requires auth — set the password in .env.
    command: hermes dashboard --host 0.0.0.0 --port 9119 --no-open --skip-build
    depends_on:
      pricewatch:
        condition: service_healthy
    ports:
      - "${HERMES_DASHBOARD_PORT:-9119}:9119"
    volumes:
      - hermes_home:/root/.hermes
      - ./workspace:/work
    restart: unless-stopped

  # ── optional: Signal delivery bridge (docker compose --profile signal up -d) ──
  signal-cli:
    image: bbernhard/signal-cli-rest-api:latest
    profiles: [signal]
    environment:
      MODE: native
    ports:
      - "${SIGNAL_PORT:-8078}:8080"
    volumes:
      - signal_data:/home/.local/share/signal-cli
    restart: unless-stopped

volumes:
  hermes_home:
  signal_data:
