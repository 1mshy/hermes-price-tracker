[project]
name = "pricewatch"
version = "1.0.0"
description = "Multi-store price tracking engine with an MCP interface for the Hermes agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx[http2]>=0.28",
    "curl_cffi>=0.7",
    "lxml>=5.2",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "apscheduler>=3.10",
    "rapidfuzz>=3.9",
    "playwright>=1.47",
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
